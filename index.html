<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Million Dollar Regret</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: #ff4444;
            font-family: 'Arial Black', sans-serif;
            text-align: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .regret-button {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: #220000;
            border: 25px solid #ff4444;
            color: #fff;
            font-size: 2.8em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 80px #ff0000, inset 0 0 60px #440000;
            margin: 30px auto;
            user-select: none;
        }
        .regret-button:active { transform: scale(0.95); }
        h1 { font-size: 3.5em; margin: 20px 0 10px; text-shadow: 0 0 30px #ff0000; }
        .counter { font-size: 2.8em; margin: 10px 0; letter-spacing: 4px; }
        .section { margin: 40px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>I REGRET BUYING THIS</h1>
        <div class="regret-button" id="big-button">CLICK TO REGRET</div>
        <div class="counter"><span id="regret-count">0</span> REGRETS</div>
        <p>$1 per public admission of terrible decision-making</p>

        <div class="section" id="wall-of-regret">
            <strong>WALL OF REGRET:</strong><br><br>
            <em>No regrets yet... be the first!</em>
        </div>

        <div class="section">
            <h2 style="color:#ffaa00;">🏆 REGRET HALL OF FAME 🏆</h2>
            <div id="leaderboard" style="background:#1a0000; padding:20px; border:4px solid #ffaa00; min-height:120px;">
                <em>No legendary regretters yet...</em>
            </div>
        </div>
    </div>

    <!-- Modal (same as before) -->
    <div id="regret-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:#111; padding:30px; border:4px solid #ff4444; max-width:500px; width:90%;">
            <h2 style="color:#ffaa00;">Buy Regrets</h2>
            <p id="total-price">$1.00</p>
            
            <label>Number of Regrets</label><br>
            <input id="quantity" type="number" value="1" min="1" style="width:100%; padding:12px; font-size:1.5em; text-align:center; margin:10px 0;">
            
            <input id="regret-name" type="text" placeholder="Your name" style="width:100%; padding:12px; margin:10px 0; background:#222; border:2px solid #ff4444; color:#fff;">
            <textarea id="regret-message" placeholder="Your regret message..." style="width:100%; height:100px; padding:12px; background:#222; border:2px solid #ff4444; color:#fff;"></textarea>
            
            <div style="margin-top:20px; text-align:center;">
                <button onclick="processPayment()" style="background:#ffaa00; color:#000; padding:15px 50px; font-size:1.4em; border:none; cursor:pointer; font-weight:bold;">PAY WITH STRIPE</button>
                <button onclick="closeModal()" style="margin-left:15px; background:#444; color:#fff; padding:15px 30px;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let count = 0;
        const countEl = document.getElementById('regret-count');
        const button = document.getElementById('big-button');
        const quantityInput = document.getElementById('quantity');

        button.addEventListener('click', () => {
            document.getElementById('regret-modal').style.display = 'flex';
            updateTotal();
        });

        quantityInput.addEventListener('input', updateTotal);

        function updateTotal() {
            const qty = parseInt(quantityInput.value) || 1;
            document.getElementById('total-price').textContent = `$${(qty).toFixed(2)}`;
        }

        function closeModal() {
            document.getElementById('regret-modal').style.display = 'none';
        }

        function processPayment() {
            const qty = parseInt(quantityInput.value) || 1;
            const name = document.getElementById('regret-name').value.trim() || "Anonymous";
            const message = document.getElementById('regret-message').value.trim() || "Multiple regrets...";
            closeModal();
            alert(`Processing $${qty}.00 with Stripe... (Demo)`);

            count += qty;
            countEl.textContent = count;

            const wall = document.getElementById('wall-of-regret');
            const entry = document.createElement('div');
            entry.innerHTML = `<strong>${name} ×${qty}</strong> — "${message}" <span style="opacity:0.6">- just now</span>`;
            if (wall.querySelector('em')) wall.innerHTML = '';
            wall.appendChild(entry);
        }
    </script>
</body>
</html>
